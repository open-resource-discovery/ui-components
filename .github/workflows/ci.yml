name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linting:
    name: Static linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "26"

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run eslint:ci

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Run Unit Tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "26"

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
